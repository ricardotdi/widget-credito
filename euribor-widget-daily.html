<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --gold:      #A19276;
    --gold-light:#C4AF94;
    --dark:      #0f1117;
    --dark2:     #181c26;
    --dark3:     #1e2333;
    --border:    rgba(255,255,255,0.07);
    --text:      #e8e4dd;
    --muted:     #7a7a8a;
    --up:        #4ade80;
    --down:      #f87171;
    --up-dim:    rgba(74,222,128,0.1);
    --down-dim:  rgba(248,113,113,0.1);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--dark);
    color: var(--text);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }

  .widget {
    width: 100%;
    max-width: 700px;
    background: var(--dark2);
    border-radius: 20px;
    border: 1px solid var(--border);
    overflow: hidden;
    box-shadow: 0 32px 80px rgba(0,0,0,0.5);
  }

  .widget-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px 14px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(161,146,118,0.07), transparent);
  }
  .header-left { display:flex; align-items:center; gap:10px; }
  .dot {
    width:8px; height:8px; border-radius:50%;
    background: var(--gold); box-shadow: 0 0 8px var(--gold);
    animation: pulse 2.5s infinite;
  }
  @keyframes pulse {
    0%,100%{ opacity:1; transform:scale(1); }
    50%     { opacity:0.4; transform:scale(1.35); }
  }
  .widget-title {
    font-size: 0.82rem; font-weight:600;
    letter-spacing: 0.12em; text-transform:uppercase;
    color: var(--gold-light);
  }
  .bce-badge {
    font-family:'DM Mono',monospace;
    font-size:0.68rem; color:var(--muted);
  }

  .rates-grid {
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:1px; background:var(--border);
    border-bottom: 1px solid var(--border);
  }
  .rate-card {
    background:var(--dark2); padding:14px 18px;
    cursor:pointer; transition:background 0.2s;
    position:relative;
  }
  .rate-card:hover { background:var(--dark3); }
  .rate-card.active { background:var(--dark3); }
  .rate-card.active::after {
    content:""; position:absolute; bottom:0; left:0; right:0;
    height:2px; background:var(--gold);
  }
  .rate-label {
    font-size:0.68rem; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.08em; margin-bottom:5px;
  }
  .rate-value {
    font-family:'DM Mono',monospace;
    font-size:1.35rem; font-weight:500; color:var(--text);
    margin-bottom:4px; letter-spacing:-0.02em;
  }
  .rate-value span { font-size:0.8rem; color:var(--muted); }
  .rate-change {
    display:inline-flex; align-items:center; gap:3px;
    font-family:'DM Mono',monospace;
    font-size:0.68rem; font-weight:500;
    padding:2px 7px; border-radius:999px;
  }
  .rate-change.up   { color:var(--up);   background:var(--up-dim); }
  .rate-change.down { color:var(--down); background:var(--down-dim); }
  .rate-change.flat { color:var(--muted); background:rgba(255,255,255,0.05); }
  .rate-updated {
    font-size:0.62rem; color:var(--muted);
    margin-top:3px; font-family:'DM Mono',monospace;
  }

  .tabs {
    display:flex; gap:4px;
    padding:10px 22px 0;
    border-bottom:1px solid var(--border);
  }
  .tab {
    padding:6px 14px; border-radius:8px 8px 0 0;
    font-size:0.78rem; font-weight:500;
    cursor:pointer; color:var(--muted);
    border:1px solid transparent; border-bottom:none;
    transition:all 0.2s; user-select:none; background:transparent;
  }
  .tab:hover { color:var(--text); }
  .tab.active {
    color:var(--gold-light); background:var(--dark3);
    border-color:var(--border); border-bottom-color:var(--dark3);
  }

  .chart-area { padding:18px 22px 14px; display:none; }
  .chart-sublabel {
    font-size:0.68rem; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.07em;
    margin-bottom:10px;
  }
  .chart-wrap { position:relative; width:100%; height:165px; }
  canvas { display:block; }

  .table-area { display:none; padding:6px 22px 16px; }
  .table-area.visible { display:block; }
  .history-table {
    width:100%; border-collapse:collapse; font-size:0.78rem;
  }
  .history-table th {
    text-align:left; padding:6px 8px;
    color:var(--muted); font-weight:500;
    font-size:0.68rem; text-transform:uppercase; letter-spacing:0.07em;
    border-bottom:1px solid var(--border);
  }
  .history-table td {
    padding:6px 8px; font-family:'DM Mono',monospace;
    border-bottom:1px solid rgba(255,255,255,0.03);
  }
  .history-table tr:last-child td { border-bottom:none; }
  .history-table tr:hover td { background:rgba(255,255,255,0.02); }
  .td-date { color:var(--muted); font-size:0.72rem; }
  .td-up   { color:var(--up); }
  .td-down { color:var(--down); }
  .td-flat { color:var(--muted); }

  .widget-footer {
    padding:9px 22px; border-top:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center;
    font-size:0.68rem; color:var(--muted);
  }
  .widget-footer a { color:var(--gold); text-decoration:none; opacity:0.7; }
  .widget-footer a:hover { opacity:1; }

  .chart-loading {
    display:flex; align-items:center; justify-content:center;
    height:165px; color:var(--muted); font-size:0.8rem; gap:8px;
  }
  .spinner {
    width:14px; height:14px; border-radius:50%;
    border:2px solid var(--border); border-top-color:var(--gold);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media(max-width:500px){
    .rates-grid { grid-template-columns:1fr; }
    body { padding:10px; }
  }
</style>
</head>
<body>
<div class="widget">

  <div class="widget-header">
    <div class="header-left">
      <div class="dot"></div>
      <div class="widget-title">Taxas Euribor</div>
    </div>
    <div class="bce-badge"></div>
  </div>

  <div class="rates-grid" id="rates-grid"></div>

  <div class="tabs">
    <div class="tab"        onclick="setTab('chart')">Gráfico 12 meses</div>
    <div class="tab active" onclick="setTab('table')">Tabela mensal</div>
  </div>

  <!-- Gráfico (oculto por defeito) -->
  <div class="chart-area" id="chart-area">
    <div class="chart-sublabel" id="chart-sublabel">
      Euribor 3 meses — médias mensais · Fonte: BCE
    </div>
    <div class="chart-wrap">
      <div class="chart-loading" id="chart-loading">
        <div class="spinner"></div> A carregar dados BCE...
      </div>
      <canvas id="euribor-chart" width="600" height="165" style="display:none; width:100%; height:165px;"></canvas>
    </div>
  </div>

  <!-- Tabela (visível por defeito) -->
  <div class="table-area visible" id="table-area">
    <table class="history-table">
      <thead><tr>
        <th>Mês</th><th>3M</th><th>6M</th><th>12M</th><th>Var. 3M</th>
      </tr></thead>
      <tbody id="history-body"></tbody>
    </table>
  </div>

  <div class="widget-footer">
    <span><span id="bce-badge"></span> Gráfico: <a href="https://data.ecb.europa.eu" target="_blank">BCE</a> · Médias mensais</span>
    <span id="footer-daily">Taxas diárias: atualização manual</span>
  </div>

</div>

<script>
const DAILY = {
  e3m:  "2.204",
  e6m:  "2.619",
  e12m: "2.848",
  date: "2026-05-22"
};

const WORKER_URL = "https://euribor-daily.ricardotdi.workers.dev";

const MESES_PT = ["jan","fev","mar","abr","mai","jun",
                  "jul","ago","set","out","nov","dez"];

let monthlyData = null;
let activeMat   = "e3m";
let activeTab   = "table";
let chartInst   = null;
let chartJsReady = false;

function fmtMonth(yyyymm) {
  if (!yyyymm) return "";
  const [y, m] = yyyymm.split("-");
  return MESES_PT[parseInt(m)-1] + " " + y;
}

function fmtDatePT(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return d + "/" + m + "/" + y;
}

function chgClass(v) {
  if (v === null || v === 0) return "flat";
  return v > 0 ? "up" : "down";
}

function chgLabel(v) {
  if (v === null) return "—";
  if (v === 0)    return "—";
  return (v > 0 ? "▲ +" : "▼ ") + Math.abs(v).toFixed(3);
}

function renderRates() {
  const mats = [
    { key:"e3m",  label:"3 meses"  },
    { key:"e6m",  label:"6 meses"  },
    { key:"e12m", label:"12 meses" }
  ];

  function monthlyChange(key) {
    const hist = monthlyData?.[key] || [];
    if (hist.length < 2) return null;
    const last = hist[hist.length-1].rate;
    const prev = hist[hist.length-2].rate;
    return parseFloat((last - prev).toFixed(3));
  }

  let html = "";
  mats.forEach(m => {
    const val = DAILY[m.key];
    const chg = monthlyChange(m.key);
    const cc  = chgClass(chg);
    const cl  = chgLabel(chg);

    html += `
      <div class="rate-card ${m.key === activeMat ? "active" : ""}"
           onclick="setMat('${m.key}')">
        <div class="rate-label">Euribor ${m.label}</div>
        <div class="rate-value">${val}<span>%</span></div>
        <div class="rate-change ${cc}">${cl}
          <span style="font-weight:300;opacity:0.6;font-size:0.6rem">vs mês ant.</span>
        </div>
        <div class="rate-updated">em ${fmtDatePT(DAILY.date)}</div>
      </div>`;
  });

  document.getElementById("rates-grid").innerHTML = html;
  document.getElementById("footer-daily").textContent =
    "Taxas diárias: " + fmtDatePT(DAILY.date);
}

function renderChart() {
  const hist = monthlyData?.[activeMat] || [];

  // Se dados ou Chart.js não estão prontos, aguarda e tenta de novo
  if (!hist.length || !chartJsReady) {
    document.getElementById("chart-loading").style.display = "";
    document.getElementById("euribor-chart").style.display = "none";
    setTimeout(renderChart, 150);
    return;
  }

  document.getElementById("chart-loading").style.display = "none";
  const canvas = document.getElementById("euribor-chart");
  canvas.style.display = "block";

  if (chartInst) { chartInst.destroy(); chartInst = null; }

  // Definir dimensões explícitas baseadas no contentor
  const wrap = document.querySelector(".chart-wrap");
  canvas.width  = wrap.clientWidth  || 600;
  canvas.height = wrap.clientHeight || 165;

  const ctx = canvas.getContext("2d");
  const labels = hist.map(d => fmtMonth(d.date));
  const rates  = hist.map(d => d.rate);

  const grad = ctx.createLinearGradient(0, 0, 0, 165);
  grad.addColorStop(0, "rgba(161,146,118,0.28)");
  grad.addColorStop(1, "rgba(161,146,118,0)");

  const matLabels = { e3m:"3 meses", e6m:"6 meses", e12m:"12 meses" };
  document.getElementById("chart-sublabel").textContent =
    "Euribor " + matLabels[activeMat] + " — médias mensais · Fonte: BCE";

  const lastDate = hist[hist.length-1]?.date || "";
  document.getElementById("bce-badge").textContent =
    "Último dado BCE: " + fmtMonth(lastDate) + " ·";

  chartInst = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        data: rates,
        borderColor: "#A19276",
        borderWidth: 2,
        backgroundColor: grad,
        pointRadius: 3,
        pointHoverRadius: 6,
        pointBackgroundColor: "#A19276",
        tension: 0.35,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode:"index", intersect:false },
      plugins: {
        legend: { display:false },
        tooltip: {
          backgroundColor: "#1e2333",
          borderColor: "rgba(161,146,118,0.3)",
          borderWidth: 1,
          titleColor: "#7a7a8a",
          bodyColor: "#e8e4dd",
          bodyFont: { family:"DM Mono", size:13 },
          callbacks: {
            title: ctx => ctx[0].label,
            label: ctx => "  " + ctx.parsed.y.toFixed(3) + "%"
          }
        }
      },
      scales: {
        x: {
          ticks: {
            color:"#7a7a8a", font:{ size:10, family:"DM Mono" },
            maxRotation:0, maxTicksLimit:12
          },
          grid:{ color:"rgba(255,255,255,0.04)" }
        },
        y: {
          ticks: {
            color:"#7a7a8a", font:{ size:10, family:"DM Mono" },
            callback: v => v.toFixed(2)+"%"
          },
          grid:{ color:"rgba(255,255,255,0.04)" }
        }
      }
    }
  });
}

function renderTable() {
  const m3  = monthlyData?.e3m  || [];
  const m6  = monthlyData?.e6m  || [];
  const m12 = monthlyData?.e12m || [];
  const len = Math.max(m3.length, m6.length, m12.length);

  let rows = "";
  for (let i = len-1; i >= 0; i--) {
    const d3  = m3[i]  || {};
    const d6  = m6[i]  || {};
    const d12 = m12[i] || {};

    const chg3 = (m3[i] && m3[i-1])
      ? parseFloat((m3[i].rate - m3[i-1].rate).toFixed(3)) : null;
    const cc = chgClass(chg3);
    const cl = chgLabel(chg3);

    rows += `<tr>
      <td class="td-date">${fmtMonth(d3.date || d6.date || d12.date)}</td>
      <td>${d3.rate  !== undefined ? d3.rate.toFixed(3)+"%"  : "—"}</td>
      <td>${d6.rate  !== undefined ? d6.rate.toFixed(3)+"%"  : "—"}</td>
      <td>${d12.rate !== undefined ? d12.rate.toFixed(3)+"%" : "—"}</td>
      <td class="td-${cc}">${cl}</td>
    </tr>`;
  }
  document.getElementById("history-body").innerHTML = rows;
}

function setMat(key) {
  activeMat = key;
  renderRates();
  if (activeTab === "chart") renderChart();
}

function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab").forEach((el, i) => {
    el.classList.toggle("active",
      (i === 0 && tab === "chart") || (i === 1 && tab === "table"));
  });
  document.getElementById("chart-area").style.display  = tab === "chart" ? "" : "none";
  document.getElementById("table-area").classList.toggle("visible", tab === "table");
  if (tab === "chart") {
    if (chartJsReady) {
      renderChart();
    } else {
      document.getElementById("chart-loading").style.display = "";
      document.getElementById("euribor-chart").style.display = "none";
      const wait = setInterval(() => {
        if (chartJsReady) { clearInterval(wait); renderChart(); }
      }, 100);
    }
  }
  if (tab === "table") { renderTable(); setTimeout(reportHeight, 50); }
}

function reportHeight() {
  const h = document.querySelector(".widget").scrollHeight + 40;
  window.parent.postMessage({ type: "setHeight", value: h + "px" }, "*");
}

// ── Init ──────────────────────────────────────────────────────

renderRates();

// Carregar Chart.js e dados em paralelo, renderizar tabela quando dados chegam
const chartScript = document.createElement("script");
chartScript.src = "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js";
chartScript.onload = function() {
  chartJsReady = true;
  // Se já estamos no gráfico e os dados chegaram, renderiza agora
  if (activeTab === "chart" && monthlyData) renderChart();
};
document.head.appendChild(chartScript);

fetch(WORKER_URL)
  .then(r => r.json())
  .then(json => {
    if (json.error) throw new Error(json.error);
    monthlyData = json;
    renderRates();
    renderTable();
    // Se já estamos no gráfico e o Chart.js carregou, renderiza agora
    if (activeTab === "chart" && chartJsReady) renderChart();
  })
  .catch(err => console.error(err));
</script>
</body>
</html>
