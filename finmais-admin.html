<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Jost:wght@300;400;500&display=swap');

  :root {
    --gold: #978E58;
    --gold2: #CBA676;
    --taupe: #A19276;
    --dark: #1a1a18;
    --mid: #2e2e2a;
    --surface: #242420;
    --border: #3a3a34;
    --text: #e8e4da;
    --muted: #8a8578;
    --danger: #c0392b;
    --success: #4a7c59;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── LOGIN ── */
  #login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--dark);
  }

  .login-box {
    width: 360px;
    padding: 50px 40px;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 300;
    color: var(--gold2);
    letter-spacing: 6px;
    text-align: center;
    margin-bottom: 8px;
  }

  .logo-sub {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  input, select, textarea {
    width: 100%;
    background: var(--mid);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 11px 14px;
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--gold);
  }

  select option { background: var(--mid); }

  .btn {
    padding: 11px 24px;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--gold);
    color: var(--dark);
    width: 100%;
  }

  .btn-primary:hover { background: var(--gold2); }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

  .btn-danger {
    background: transparent;
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 11px;
    padding: 6px 12px;
  }

  .btn-danger:hover { background: var(--danger); color: white; }

  .btn-sm {
    padding: 7px 14px;
    font-size: 11px;
    letter-spacing: 1.5px;
  }

  /* ── APP LAYOUT ── */
  #app { display: none; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    color: var(--gold2);
    letter-spacing: 4px;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .topbar-right span {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 1px;
  }

  .main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* ── ACTIONS BAR ── */
  .actions-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .actions-bar h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: 1px;
  }

  .actions-right { display: flex; gap: 10px; flex-wrap: wrap; }

  /* ── TABLE ── */
  .table-wrap {
    border: 1px solid var(--border);
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    background: var(--surface);
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface); }

  td {
    padding: 13px 16px;
    color: var(--text);
    font-size: 13px;
    vertical-align: middle;
  }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .badge-active { background: rgba(74,124,89,0.2); color: #6dbd8a; border: 1px solid rgba(74,124,89,0.4); }
  .badge-inactive { background: rgba(160,146,118,0.15); color: var(--muted); border: 1px solid var(--border); }
  .badge-pending { background: rgba(151,142,88,0.2); color: var(--gold); border: 1px solid rgba(151,142,88,0.4); }

  .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
  }

  .modal-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--gold2);
    letter-spacing: 1px;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    transition: color 0.2s;
  }

  .modal-close:hover { color: var(--text); }

  .modal-body { padding: 24px; }

  .form-group { margin-bottom: 18px; }

  .form-group label {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 7px;
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .modal-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  /* ── DETAIL PANEL ── */
  .detail-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 28px;
    margin-top: 24px;
  }

  .detail-panel.open { display: block; }

  .detail-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .detail-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--gold2);
  }

  .detail-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .meta-item { }
  .meta-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .meta-value { font-size: 14px; color: var(--text); }

  .section-title {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* ── PROCESSO CARD ── */
  .process-card {
    border: 1px solid var(--border);
    padding: 20px;
    margin-bottom: 16px;
    background: var(--mid);
  }

  .process-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .process-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    color: var(--gold2);
  }

  /* ── TIMELINE ── */
  .timeline { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }

  .tl-step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
  }

  .tl-step:hover { border-color: var(--gold); }
  .tl-step.active { border-color: var(--gold); background: rgba(151,142,88,0.1); }
  .tl-step.done { border-color: var(--success); background: rgba(74,124,89,0.08); }

  .tl-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .tl-step.done .tl-dot { background: var(--success); border-color: var(--success); }
  .tl-step.active .tl-dot { background: var(--gold); border-color: var(--gold); }

  .tl-label { font-size: 13px; }
  .tl-step.active .tl-label { color: var(--gold); }
  .tl-step.done .tl-label { color: #6dbd8a; }

  /* ── UPLOAD WINDOWS ── */
  .window-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }

  .window-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border: 1px solid var(--border);
    background: var(--dark);
    gap: 10px;
    flex-wrap: wrap;
  }

  .window-dates { font-size: 12px; color: var(--text); }
  .window-note { font-size: 11px; color: var(--muted); }

  /* ── ADD WINDOW FORM ── */
  .add-window-form {
    border: 1px dashed var(--border);
    padding: 16px;
    margin-top: 12px;
  }

  .add-window-form .form-row { grid-template-columns: 1fr 1fr; }

  /* ── TOAST ── */
  #toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--surface);
    border: 1px solid var(--gold);
    color: var(--text);
    padding: 14px 22px;
    font-size: 13px;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    max-width: 320px;
  }

  #toast.show { opacity: 1; }
  #toast.error { border-color: var(--danger); }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
  }

  .divider { height: 1px; background: var(--border); margin: 24px 0; }
</style>
</head>
<body>

<!-- LOGIN -->

<div id="toast"></div>

<script>
const API = 'https://credito-backend-ffnk.onrender.com';
const STEPS = [
  '📋 Pedido recebido',
  '📁 Documentação em análise',
  '🏦 Proposta enviada a bancos',
  '🏦 Análise das respostas bancárias em curso',
  '📝 Contrato em preparação',
  '🎉 Processo concluído',
];

let clients = [];
let currentClientId = null;
let currentProcessId = null;
let adminToken = null;

// ── UTILS ──────────────────────────────────────────────────────────────────
function showToast(msg, error = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (error ? ' error' : '');
  setTimeout(() => t.className = '', 3000);
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('pt-PT');
}

function fmtDateTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function isWindowActive(w) {
  const now = new Date();
  return new Date(w.start) <= now && new Date(w.end) >= now;
}

function isUploadActive(process) {
  return (process.uploadWindows || []).some(isWindowActive);
}

function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ── AUTH ───────────────────────────────────────────────────────────────────
async function adminLogin() {
  const pass = document.getElementById('admin-pass').value;
  try {
    const r = await fetch(`${API}/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass }),
    });
    const d = await r.json();
    if (d.success) {
      adminToken = pass;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadClients();
    } else {
      document.getElementById('login-error').textContent = d.message;
    }
  } catch {
    document.getElementById('login-error').textContent = 'Erro de ligação ao servidor';
  }
}

function logout() {
  adminToken = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('admin-pass').value = '';
}

// ── CLIENTES ───────────────────────────────────────────────────────────────
async function loadClients() {
  try {
    const r = await fetch(`${API}/admin/clients`);
    clients = await r.json();
    renderTable();
  } catch {
    showToast('Erro ao carregar clientes', true);
  }
}

function renderTable() {
  const tbody = document.getElementById('clients-tbody');
  if (!clients.length) {
    tbody.innerHTML = '<tr><td colspan="9" class="empty-state">Nenhum cliente registado</td></tr>';
    return;
  }

  tbody.innerHTML = clients.map(c => {
    const lastProc = c.processes?.[c.processes.length - 1];
    const uploadOn = lastProc ? isUploadActive(lastProc) : false;
    const accountStatus = c.activated
      ? '<span class="badge badge-active">Ativa</span>'
      : '<span class="badge badge-pending">Pendente</span>';
    const uploadStatus = uploadOn
      ? '<span class="badge badge-active">Ativo</span>'
      : '<span class="badge badge-inactive">Inativo</span>';

    return `
      <tr>
        <td>${c.name}</td>
        <td>${c.email}</td>
        <td>${c.phone || '—'}</td>
        <td>${c.concelho || '—'}</td>
        <td>${c.processNumber || '—'}</td>
        <td>${fmtDate(c.createdAt)}</td>
        <td>${accountStatus}</td>
        <td>${uploadStatus}</td>
        <td>
          <div class="actions-cell">
            <button class="btn btn-secondary btn-sm" onclick="openDetail('${c.id}')">Gerir</button>
            <button class="btn btn-secondary btn-sm" onclick="sendInvite('${c.id}')">Convidar</button>
            <button class="btn btn-danger" onclick="deleteClient('${c.id}')">✕</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

function openNewClientModal() {
  ['nc-name','nc-email','nc-phone','nc-concelho','nc-process'].forEach(id => document.getElementById(id).value = '');
  openModal('modal-new-client');
}

async function createClient() {
  const name = document.getElementById('nc-name').value.trim();
  const email = document.getElementById('nc-email').value.trim();
  const phone = document.getElementById('nc-phone').value.trim();
  const concelho = document.getElementById('nc-concelho').value.trim();
  const processNumber = document.getElementById('nc-process').value.trim();

  if (!name || !email) return showToast('Nome e email são obrigatórios', true);

  try {
    const r = await fetch(`${API}/admin/clients`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, phone, concelho, processNumber }),
    });
    const d = await r.json();
    if (d.success) {
      closeModal('modal-new-client');
      showToast('Cliente criado com sucesso');
      loadClients();
    } else {
      showToast(d.message || 'Erro ao criar cliente', true);
    }
  } catch {
    showToast('Erro de ligação', true);
  }
}

async function deleteClient(id) {
  if (!confirm('Eliminar este cliente? Esta ação é irreversível.')) return;
  try {
    await fetch(`${API}/admin/clients/${id}`, { method: 'DELETE' });
    showToast('Cliente eliminado');
    if (currentClientId === id) closeDetail();
    loadClients();
  } catch {
    showToast('Erro ao eliminar', true);
  }
}

async function sendInvite(clientId) {
  try {
    const r = await fetch(`${API}/admin/invite`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clientId }),
    });
    const d = await r.json();
    if (d.success) showToast('Convite enviado com sucesso');
    else showToast(d.message || 'Erro ao enviar convite', true);
  } catch {
    showToast('Erro de ligação', true);
  }
}

// ── DETAIL PANEL ───────────────────────────────────────────────────────────
function openDetail(clientId) {
  currentClientId = clientId;
  const c = clients.find(x => x.id === clientId);
  if (!c) return;

  document.getElementById('detail-name').textContent = c.name;

  document.getElementById('detail-meta').innerHTML = `
    <div class="meta-item"><div class="meta-label">Email</div><div class="meta-value">${c.email}</div></div>
    <div class="meta-item"><div class="meta-label">Telefone</div><div class="meta-value">${c.phone || '—'}</div></div>
    <div class="meta-item"><div class="meta-label">Concelho</div><div class="meta-value">${c.concelho || '—'}</div></div>
    <div class="meta-item"><div class="meta-label">Nº Processo</div><div class="meta-value">${c.processNumber || '—'}</div></div>
    <div class="meta-item"><div class="meta-label">Criado em</div><div class="meta-value">${fmtDate(c.createdAt)}</div></div>
    <div class="meta-item"><div class="meta-label">Conta</div><div class="meta-value">${c.activated ? '✅ Ativa' : '⏳ Pendente'}</div></div>
  `;

  renderProcesses(c);

  const panel = document.getElementById('detail-panel');
  panel.classList.add('open');
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function closeDetail() {
  currentClientId = null;
  document.getElementById('detail-panel').classList.remove('open');
}

function renderProcesses(client) {
  const container = document.getElementById('detail-processes');

  if (!client.processes || !client.processes.length) {
    container.innerHTML = '<div class="empty-state">Nenhum processo</div>';
    return;
  }

  container.innerHTML = `
    <div class="section-title">Processos</div>
    ${client.processes.map(proc => renderProcessCard(client.id, proc)).join('')}
    <button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="openNewProcess('${client.id}')">+ Novo Processo</button>
  `;
}

function renderProcessCard(clientId, proc) {
  const uploadActive = isUploadActive(proc);

  const stepsHtml = STEPS.map((s, i) => {
    let cls = '';
    if (i < proc.currentStep) cls = 'done';
    else if (i === proc.currentStep) cls = 'active';
    return `<div class="tl-step ${cls}" onclick="setStep('${clientId}','${proc.id}',${i})">
      <div class="tl-dot"></div>
      <div class="tl-label">${s}</div>
    </div>`;
  }).join('');

  const windowsHtml = (proc.uploadWindows || []).map(w => {
    const active = isWindowActive(w);
    return `<div class="window-item">
      <div>
        <div class="window-dates">
          ${fmtDateTime(w.start)} → ${fmtDateTime(w.end)}
          ${active ? '<span class="badge badge-active" style="margin-left:8px">Ativo</span>' : '<span class="badge badge-inactive" style="margin-left:8px">Expirado</span>'}
        </div>
        ${w.note ? `<div class="window-note">${w.note}</div>` : ''}
      </div>
      <button class="btn btn-danger" onclick="deleteWindow('${clientId}','${proc.id}','${w.id}')">✕</button>
    </div>`;
  }).join('');

  return `
    <div class="process-card">
      <div class="process-card-header">
        <div class="process-number">Processo ${proc.number || proc.id.substring(0,8)}</div>
        <div>
          <span style="font-size:11px;color:var(--muted)">Criado em ${fmtDate(proc.createdAt)}</span>
          <span class="badge ${uploadActive ? 'badge-active' : 'badge-inactive'}" style="margin-left:10px">Upload ${uploadActive ? 'Ativo' : 'Inativo'}</span>
        </div>
      </div>

      <div class="section-title">Linha Cronológica</div>
      <div class="timeline">${stepsHtml}</div>

      <div class="section-title" style="margin-top:20px">Janelas de Upload</div>
      <div class="window-list">${windowsHtml || '<div style="color:var(--muted);font-size:12px;padding:8px 0">Nenhuma janela definida</div>'}</div>
      <button class="btn btn-secondary btn-sm" onclick="openNewWindow('${clientId}','${proc.id}')">+ Nova Janela</button>
    </div>
  `;
}

// ── STEPS ──────────────────────────────────────────────────────────────────
async function setStep(clientId, processId, step) {
  try {
    await fetch(`${API}/admin/clients/${clientId}/processes/${processId}/step`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ step }),
    });
    showToast('Fase atualizada');
    await loadClients();
    const c = clients.find(x => x.id === clientId);
    if (c) renderProcesses(c);
  } catch {
    showToast('Erro ao atualizar fase', true);
  }
}

// ── NOVO PROCESSO ──────────────────────────────────────────────────────────
function openNewProcess(clientId) {
  currentClientId = clientId;
  document.getElementById('np-number').value = '';
  openModal('modal-new-process');
}

async function saveNewProcess() {
  const number = document.getElementById('np-number').value.trim();
  if (!number) return showToast('Nº do processo obrigatório', true);

  try {
    const r = await fetch(`${API}/admin/clients/${currentClientId}/processes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ number }),
    });
    const d = await r.json();
    if (d.success) {
      closeModal('modal-new-process');
      showToast('Processo criado');
      await loadClients();
      const c = clients.find(x => x.id === currentClientId);
      if (c) renderProcesses(c);
    } else {
      showToast(d.message || 'Erro', true);
    }
  } catch {
    showToast('Erro de ligação', true);
  }
}

// ── JANELAS UPLOAD ─────────────────────────────────────────────────────────
function openNewWindow(clientId, processId) {
  currentClientId = clientId;
  currentProcessId = processId;
  const now = new Date();
  const end = new Date(now.getTime() + 15 * 24 * 60 * 60 * 1000);
  document.getElementById('nw-start').value = now.toISOString().slice(0, 16);
  document.getElementById('nw-end').value = end.toISOString().slice(0, 16);
  document.getElementById('nw-note').value = '';
  openModal('modal-new-window');
}

async function saveNewWindow() {
  const start = document.getElementById('nw-start').value;
  const end = document.getElementById('nw-end').value;
  const note = document.getElementById('nw-note').value;

  if (!start || !end) return showToast('Datas obrigatórias', true);

  try {
    const r = await fetch(`${API}/admin/clients/${currentClientId}/processes/${currentProcessId}/upload-windows`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start: new Date(start).toISOString(), end: new Date(end).toISOString(), note }),
    });
    const d = await r.json();
    if (d.success) {
      closeModal('modal-new-window');
      showToast('Janela de upload criada');
      await loadClients();
      const c = clients.find(x => x.id === currentClientId);
      if (c) renderProcesses(c);
    } else {
      showToast(d.message || 'Erro', true);
    }
  } catch {
    showToast('Erro de ligação', true);
  }
}

async function deleteWindow(clientId, processId, windowId) {
  if (!confirm('Remover esta janela de upload?')) return;
  try {
    await fetch(`${API}/admin/clients/${clientId}/processes/${processId}/upload-windows/${windowId}`, { method: 'DELETE' });
    showToast('Janela removida');
    await loadClients();
    const c = clients.find(x => x.id === clientId);
    if (c) renderProcesses(c);
  } catch {
    showToast('Erro', true);
  }
}

// ── EXPORTAR CSV ───────────────────────────────────────────────────────────
function exportCSV() {
  window.open(`${API}/admin/export`, '_blank');
}

// Fechar modais ao clicar fora
document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});
</script>
</body>
</html>
