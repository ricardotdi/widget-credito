
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); color: var(--color-text-primary); }
  .wrap { padding: 1.5rem 0; max-width: 680px; }
  h2 { font-size: 18px; font-weight: 500; margin-bottom: 4px; }
  .sub { font-size: 14px; color: var(--color-text-secondary); margin-bottom: 1.5rem; }
  .drop-zone {
    border: 1.5px dashed var(--color-border-secondary);
    border-radius: var(--border-radius-lg);
    padding: 2.5rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    background: var(--color-background-secondary);
    position: relative;
  }
  .drop-zone.drag-over {
    border-color: #378ADD;
    background: #E6F1FB;
  }
  .drop-zone.has-file {
    border-color: #1D9E75;
    background: #E1F5EE;
  }
  .drop-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon { font-size: 32px; color: var(--color-text-secondary); margin-bottom: 8px; display: block; }
  .drop-label { font-size: 15px; font-weight: 500; }
  .drop-hint { font-size: 13px; color: var(--color-text-secondary); margin-top: 4px; }
  .file-name { font-size: 13px; font-weight: 500; color: #0F6E56; margin-top: 6px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 0 20px; height: 40px; border-radius: var(--border-radius-md);
    border: 0.5px solid var(--color-border-secondary); font-size: 14px; font-weight: 500;
    cursor: pointer; background: var(--color-background-primary);
    color: var(--color-text-primary); transition: background 0.12s;
    width: 100%; justify-content: center; margin-top: 1rem;
  }
  .btn:hover { background: var(--color-background-secondary); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: #0F6E56; border-color: #0F6E56; color: #fff; }
  .btn-primary:hover { background: #085041; }
  .btn-dl { background: #185FA5; border-color: #185FA5; color: #fff; }
  .btn-dl:hover { background: #0C447C; }
  .progress-wrap { margin-top: 1.25rem; display: none; }
  .progress-label { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .progress-bar-bg { height: 6px; border-radius: 3px; background: var(--color-border-tertiary); overflow: hidden; }
  .progress-bar { height: 6px; background: #1D9E75; border-radius: 3px; width: 0%; transition: width 0.3s; }
  .status { font-size: 13px; color: var(--color-text-secondary); margin-top: 8px; min-height: 18px; }
  .status.error { color: #A32D2D; }
  .status.success { color: #0F6E56; }
  .preview-wrap { margin-top: 1.5rem; display: none; }
  .preview-title { font-size: 14px; font-weight: 500; margin-bottom: 8px; }
  .table-scroll { overflow-x: auto; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 600px; }
  th { background: var(--color-background-secondary); padding: 8px 10px; text-align: left; font-weight: 500; font-size: 12px; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); white-space: nowrap; }
  td { padding: 7px 10px; border-bottom: 0.5px solid var(--color-border-tertiary); color: var(--color-text-primary); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--color-background-secondary); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .badge-ok { background: #E1F5EE; color: #085041; }
  .badge-due { background: #FCEBEB; color: #791F1F; }
  .badge-other { background: #F1EFE8; color: #444441; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1rem; }
  .metric { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 14px; }
  .metric-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .metric-val { font-size: 20px; font-weight: 500; }
</style>

<div class="wrap">
  <h2 style="display:flex;align-items:center;gap:8px;"><i class="ti ti-file-spreadsheet" aria-hidden="true" style="font-size:22px;color:#1D9E75;"></i> Extrator CRC — Banco de Portugal</h2>
  <p class="sub">Faça upload do PDF da Central de Responsabilidades de Crédito e exporte um Excel com o resumo.</p>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".pdf" />
    <i class="ti ti-upload drop-icon" aria-hidden="true"></i>
    <p class="drop-label">Arraste o PDF aqui ou clique para selecionar</p>
    <p class="drop-hint">Ficheiro CRC do Banco de Portugal (.pdf)</p>
    <p class="file-name" id="fileName"></p>
  </div>

  <button class="btn btn-primary" id="extractBtn" disabled>
    <i class="ti ti-cpu" aria-hidden="true"></i> Extrair dados com IA
  </button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label">
      <span id="progressText">A processar...</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
    <p class="status" id="status"></p>
  </div>

  <div class="preview-wrap" id="previewWrap">
    <div class="metrics" id="metricsRow"></div>
    <p class="preview-title">Pré-visualização dos dados extraídos</p>
    <div class="table-scroll"><table id="previewTable"></table></div>
    <button class="btn btn-dl" id="dlBtn" style="margin-top:1rem;">
      <i class="ti ti-download" aria-hidden="true"></i> Descarregar Excel
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileName = document.getElementById('fileName');
  const extractBtn = document.getElementById('extractBtn');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const progressPct = document.getElementById('progressPct');
  const statusEl = document.getElementById('status');
  const previewWrap = document.getElementById('previewWrap');
  const previewTable = document.getElementById('previewTable');
  const dlBtn = document.getElementById('dlBtn');
  const metricsRow = document.getElementById('metricsRow');

  let selectedFile = null;
  let extractedData = [];

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type === 'application/pdf') setFile(f);
  });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

  function setFile(f) {
    selectedFile = f;
    fileName.textContent = f.name;
    dropZone.classList.add('has-file');
    extractBtn.disabled = false;
    previewWrap.style.display = 'none';
    progressWrap.style.display = 'none';
    statusEl.className = 'status';
    statusEl.textContent = '';
  }

  function setProgress(pct, text, statusText, statusClass) {
    progressBar.style.width = pct + '%';
    progressPct.textContent = pct + '%';
    if (text) progressText.textContent = text;
    if (statusText !== undefined) { statusEl.textContent = statusText; statusEl.className = 'status' + (statusClass ? ' ' + statusClass : ''); }
  }

  async function extractPdfText(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let fullText = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map(item => item.str).join(' ');
      fullText += pageText + '\n';
    }
    return fullText;
  }

  async function callClaudeAPI(pdfText) {
    const systemPrompt = `És um especialista em análise de documentos financeiros portugueses. O utilizador vai fornecer-te o texto extraído de um documento CRC (Central de Responsabilidades de Crédito) do Banco de Portugal.

Extrai TODOS os registos de crédito encontrados e devolve APENAS um JSON array válido (sem markdown, sem texto extra) com objetos com estes campos:
- "instituicao": nome da instituição de crédito (string)
- "tipo_credito": tipo de crédito ex: "Crédito Habitação", "Crédito Pessoal", "Cartão de Crédito", "Leasing", "Descoberto", "Crédito Empresarial", etc. (string)
- "situacao": "Regular", "Vencido" ou "Abatido ao Activo" (string)
- "montante_utilizado": valor em euros como número (number ou null)
- "montante_potencial": valor limite/plafond em euros como número (number ou null)
- "prazo": data de vencimento ou prazo em texto (string ou null)
- "numero_titulares": número de titulares se disponível (number ou null)
- "observacoes": qualquer informação relevante adicional (string ou null)

Se não encontrares dados de crédito no texto, devolve [].
Devolve APENAS o JSON array, nada mais.`;

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: `Texto do CRC:\n\n${pdfText.substring(0, 15000)}` }]
      })
    });
    if (!response.ok) throw new Error('Erro na API: ' + response.status);
    const data = await response.json();
    const text = data.content.map(b => b.text || '').join('');
    const clean = text.replace(/```json|```/g, '').trim();
    return JSON.parse(clean);
  }

  function fmt(val) {
    if (val === null || val === undefined) return '—';
    if (typeof val === 'number') return val.toLocaleString('pt-PT', { style: 'currency', currency: 'EUR', minimumFractionDigits: 0 });
    return val;
  }

  function renderPreview(data) {
    const total = data.reduce((s, r) => s + (r.montante_utilizado || 0), 0);
    const totalPot = data.reduce((s, r) => s + (r.montante_potencial || 0), 0);
    const vencidos = data.filter(r => r.situacao === 'Vencido').length;

    metricsRow.innerHTML = `
      <div class="metric"><div class="metric-label">Registos</div><div class="metric-val">${data.length}</div></div>
      <div class="metric"><div class="metric-label">Total utilizado</div><div class="metric-val" style="font-size:15px;">${total.toLocaleString('pt-PT', {style:'currency',currency:'EUR',minimumFractionDigits:0})}</div></div>
      <div class="metric"><div class="metric-label">Plafond total</div><div class="metric-val" style="font-size:15px;">${totalPot.toLocaleString('pt-PT', {style:'currency',currency:'EUR',minimumFractionDigits:0})}</div></div>
      <div class="metric"><div class="metric-label">Créditos vencidos</div><div class="metric-val" style="color:${vencidos>0?'#A32D2D':'#0F6E56'}">${vencidos}</div></div>
    `;

    const cols = ['Instituição','Tipo de Crédito','Situação','Utilizado (€)','Plafond (€)','Prazo','Titulares','Observações'];
    previewTable.innerHTML = '<thead><tr>' + cols.map(c=>`<th>${c}</th>`).join('') + '</tr></thead>';
    const tbody = document.createElement('tbody');
    data.forEach(r => {
      const sitBadge = r.situacao === 'Regular' ? 'badge-ok' : r.situacao === 'Vencido' ? 'badge-due' : 'badge-other';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${r.instituicao || '—'}</td>
        <td>${r.tipo_credito || '—'}</td>
        <td><span class="badge ${sitBadge}">${r.situacao || '—'}</span></td>
        <td>${fmt(r.montante_utilizado)}</td>
        <td>${fmt(r.montante_potencial)}</td>
        <td>${r.prazo || '—'}</td>
        <td>${r.numero_titulares || '—'}</td>
        <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.observacoes||''}">${r.observacoes || '—'}</td>
      `;
      tbody.appendChild(tr);
    });
    previewTable.appendChild(tbody);
    previewWrap.style.display = 'block';
  }

  function downloadExcel(data, clientName) {
    const rows = data.map(r => ({
      'Instituição': r.instituicao || '',
      'Tipo de Crédito': r.tipo_credito || '',
      'Situação': r.situacao || '',
      'Montante Utilizado (€)': r.montante_utilizado || 0,
      'Plafond / Limite (€)': r.montante_potencial || 0,
      'Prazo / Vencimento': r.prazo || '',
      'Nº Titulares': r.numero_titulares || '',
      'Observações': r.observacoes || ''
    }));

    const totalRow = {
      'Instituição': 'TOTAL',
      'Tipo de Crédito': '',
      'Situação': '',
      'Montante Utilizado (€)': data.reduce((s,r)=>s+(r.montante_utilizado||0),0),
      'Plafond / Limite (€)': data.reduce((s,r)=>s+(r.montante_potencial||0),0),
      'Prazo / Vencimento': '',
      'Nº Titulares': '',
      'Observações': ''
    };
    rows.push(totalRow);

    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [32,22,14,22,22,18,12,30].map(w => ({wch:w}));

    const hdr = ['A1','B1','C1','D1','E1','F1','G1','H1'];
    hdr.forEach(cell => {
      if (ws[cell]) ws[cell].s = { font: { bold: true }, fill: { fgColor: { rgb: '0F6E56' } }, font: { bold: true, color: { rgb: 'FFFFFF' } } };
    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'CRC');

    const meta = XLSX.utils.aoa_to_sheet([
      ['Relatório CRC — Central de Responsabilidades de Crédito'],
      ['Data de extração:', new Date().toLocaleDateString('pt-PT')],
      ['Fonte:', 'Banco de Portugal'],
      ['Ficheiro:', clientName]
    ]);
    XLSX.utils.book_append_sheet(wb, meta, 'Info');

    XLSX.writeFile(wb, 'CRC_' + new Date().toISOString().slice(0,10) + '.xlsx');
  }

  extractBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    extractBtn.disabled = true;
    progressWrap.style.display = 'block';
    previewWrap.style.display = 'none';

    try {
      setProgress(10, 'A ler o PDF...', '');
      const pdfText = await extractPdfText(selectedFile);
      setProgress(40, 'A enviar para análise com IA...', 'Texto extraído com sucesso (' + pdfText.length + ' caracteres)');
      const data = await callClaudeAPI(pdfText);
      setProgress(90, 'A processar resultados...', 'Dados recebidos da IA');
      extractedData = data;
      if (data.length === 0) {
        setProgress(100, 'Concluído', 'Nenhum registo de crédito encontrado no documento. Verifique se é um PDF CRC válido.', 'error');
      } else {
        setProgress(100, 'Concluído!', data.length + ' registo(s) de crédito extraído(s) com sucesso.', 'success');
        renderPreview(data);
      }
    } catch(e) {
      setProgress(0, 'Erro', 'Erro: ' + e.message, 'error');
    }
    extractBtn.disabled = false;
  });

  dlBtn.addEventListener('click', () => {
    if (extractedData.length > 0) downloadExcel(extractedData, selectedFile ? selectedFile.name : 'CRC.pdf');
  });
</script>
