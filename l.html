<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f0e6">
<title>Bruma Finance | Links</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    /* tom da última linha da arte, para não se ver a emenda quando o ecrã
       é mais alto do que a imagem */
    background: #e4dbcb;
    font-family: Arial, Helvetica, sans-serif;
  }
  .pagina {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }
  @media (min-height: 1100px) {
    .pagina { align-items: center; }
  }
  /* A arte dá a página inteira; as ligações são áreas por cima dela, em
     percentagem, para acompanharem a imagem em qualquer largura de ecrã. */
  .arte {
    position: relative;
    width: 100%;
    max-width: 560px;
    line-height: 0;
  }
  .arte img { width: 100%; height: auto; display: block; }

  .zona {
    position: absolute;
    display: block;
    border-radius: 2.6% / 18%;
    text-indent: -9999px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .zona:hover { background: rgba(21, 58, 38, 0.06); }
  .zona:active { transform: scale(0.99); }
  .zona:focus-visible { outline: 3px solid #153A26; outline-offset: 2px; }

  /* Os quatro cartões, medidos na própria arte (941 x 1672) */
  .zona.botao { left: 14.5%; width: 71.1%; height: 6.3%; }
  .zona.website   { top: 41.1%; }
  .zona.instagram { top: 48.2%; }
  .zona.facebook  { top: 55.7%; }
  .zona.whatsapp  { top: 63.3%; }

  /* Telefone e email, escritos na arte, também são clicáveis */
  .zona.contacto { left: 31%; width: 42%; height: 2.6%; border-radius: 6px; }
  .zona.telefone { top: 80.9%; }
  .zona.email    { top: 83.9%; }
</style>
</head>
<body>
  <main class="pagina">
    <div class="arte">
      <img src="links-bruma.jpg" width="941" height="1672"
           alt="Bruma Finance. Tudo o que precisa, num só lugar. Ricardo Custódio, intermediário de crédito: 911 511 908, geral@brumafinance.pt, Continente, Madeira e Açores.">

      <a class="zona botao website" href="https://brumafinance.pt" target="_blank" rel="noopener">Website Bruma Finance</a>
      <a class="zona botao instagram" href="https://www.instagram.com/finmais.pt/" target="_blank" rel="noopener">Instagram</a>
      <a class="zona botao facebook" href="https://www.facebook.com/finmais.pt/" target="_blank" rel="noopener">Facebook</a>
      <a class="zona botao whatsapp" href="https://wa.me/351911511908?text=Ol%C3%A1%2C%20vi%20a%20Bruma%20Finance%20e%20gostaria%20que%20me%20contactassem%20para%20perceber%20como%20podem%20ajudar-me%20no%20cr%C3%A9dito." target="_blank" rel="noopener">WhatsApp</a>

      <a class="zona contacto telefone" href="tel:+351911511908">Telefone 911 511 908</a>
      <a class="zona contacto email" href="mailto:geral@brumafinance.pt">geral@brumafinance.pt</a>
    </div>
  </main>
</body>
</html>
