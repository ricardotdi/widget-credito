<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fin+ | Intermediário de Crédito</title>
<style>
  :root {
    --navy: #14283F;
    --navy-deep: #0E1E30;
    --gold: #C79A6E;
    --gold-soft: #A9855F;
    --line: rgba(199,154,110,0.28);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(120% 90% at 50% -10%, #1C3654 0%, var(--navy) 45%, var(--navy-deep) 100%);
    min-height: 100vh;
    font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 100%;
    max-width: 420px;
    padding: 48px 28px 36px;
    text-align: center;
  }
  .logo {
    width: 132px;
    margin: 0 auto 6px;
    display: block;
  }
  .tagline {
    font-size: 12.5px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    margin: 4px 0 38px;
    font-weight: 500;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(255,255,255,0.02);
    color: #fff;
    text-decoration: none;
    font-size: 15.5px;
    font-weight: 400;
    letter-spacing: 0.2px;
    transition: border-color .2s ease, background .2s ease, transform .2s ease;
  }
  a.link:active { transform: scale(0.98); }
  a.link:hover {
    border-color: var(--gold);
    background: rgba(199,154,110,0.08);
  }
  a.link .icon {
    width: 22px; height: 22px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  a.link svg { width: 100%; height: 100%; }
  a.link .label { flex: 1; text-align: left; }
  a.link .chev { color: var(--gold-soft); font-size: 18px; }

  footer {
    margin-top: 42px;
    font-size: 10.5px;
    letter-spacing: 0.6px;
    color: var(--gold-soft);
    line-height: 1.6;
  }
  footer .rule {
    width: 60px; height: 1px;
    background: var(--line);
    margin: 0 auto 14px;
  }
</style>
</head>
