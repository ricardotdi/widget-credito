<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: transparent; }
  .box { display: inline-block; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; font-size: 13px; min-width: 220px; width: 100%; }
  .header { background: #A19276; color: #fff; text-align: center; padding: 6px 12px; font-weight: bold; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 14px; border-bottom: 1px solid #e5e7eb; background: #fff; }
  .row:last-of-type { border-bottom: none; }
  .row-label { color: #374151; font-weight: 500; font-size: 12.5px; }
  .row-val { font-weight: bold; font-size: 12.5px; color: #A19276; white-space: nowrap; }
  .footer { background: #f9fafb; text-align: center; padding: 4px 10px; font-size: 10px; color: #9ca3af; border-top: 1px solid #e5e7eb; }
</style>
</head>
<body>
<div class="box">
  <div class="header">Spread mínimo — Crédito Habitação</div>
  <div class="row">
    <span class="row-label">Aquisição</span>
    <span class="row-val">desde 0,60%</span>
  </div>
  <div class="row">
    <span class="row-label">Construção</span>
    <span class="row-val">desde 1,00%</span>
  </div>
  <div class="row">
    <span class="row-label">Transferência</span>
    <span class="row-val">desde 0,75%</span>
  </div>
  <div class="footer"><span id="data-auto"></span> · Fonte: mercado PT</div>
</div>
<script>
  var meses = ["janeiro","fevereiro","março","abril","maio","junho",
               "julho","agosto","setembro","outubro","novembro","dezembro"];
  var d = new Date();
  document.getElementById("data-auto").textContent =
    "Atualizado: " + meses[d.getMonth()] + " " + d.getFullYear();
</script>
</body>
</html>
